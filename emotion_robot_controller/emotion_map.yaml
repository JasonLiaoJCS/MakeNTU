emotions:
  neutral:
    definition: "使用者沒有明顯正負情緒，或只是普通描述狀態。"
    robot_emotion: neutral
    face_id: FACE_NEUTRAL
    motion_id: CENTER
    roll_feature: "回到中心，保持穩定。"
    pitch_feature: "回到中心。"
    speed: 20
    amplitude: "none"
    hold_ms: 800
    return_to_center: true
    default_roll_bias: 0
    default_pitch_bias: 0
    reply_style: "平穩、簡短、自然。"
    fallback_reply: "我在這裡，聽你說。"
  happy:
    definition: "使用者表達開心、滿足、被支持、順利完成事情。"
    robot_emotion: happy
    face_id: FACE_HAPPY
    motion_id: HAPPY_NOD_SWAY
    roll_feature: "小幅左右歪頭。"
    pitch_feature: "輕微點頭。"
    speed: 30
    amplitude: "small"
    hold_ms: 1200
    return_to_center: true
    default_roll_bias: 0
    default_pitch_bias: -3
    reply_style: "明亮、簡短、親切。"
    fallback_reply: "聽起來很棒！我也替你開心。"
  excited:
    definition: "使用者非常期待、興奮、能量高，但不一定只是開心。"
    robot_emotion: excited
    face_id: FACE_EXCITED
    motion_id: EXCITED_FAST_NOD
    roll_feature: "小幅快速擺動。"
    pitch_feature: "比 happy 更快的點頭，但避免暴力。"
    speed: 45
    amplitude: "medium"
    hold_ms: 900
    return_to_center: true
    default_roll_bias: 0
    default_pitch_bias: -4
    reply_style: "有活力、鼓舞、不要太長。"
    fallback_reply: "哇，這聽起來很令人期待！"
  sad:
    definition: "使用者表達難過、失落、想哭、被挫折壓住。"
    robot_emotion: sad
    face_id: FACE_SAD
    motion_id: SAD_LOWER_HEAD
    roll_feature: "小幅偏向一側。"
    pitch_feature: "慢慢低頭。"
    speed: 15
    amplitude: "small"
    hold_ms: 1600
    return_to_center: false
    default_roll_bias: -3
    default_pitch_bias: 6
    reply_style: "溫柔、安慰、慢一點。"
    fallback_reply: "聽起來真的不好受，我會陪你慢慢整理。"
  tired:
    definition: "使用者表達疲倦、沒力、撐不下去、耗盡。"
    robot_emotion: tired
    face_id: FACE_TIRED
    motion_id: TIRED_DROOP
    roll_feature: "幾乎不左右動。"
    pitch_feature: "很慢地下垂。"
    speed: 12
    amplitude: "small"
    hold_ms: 1800
    return_to_center: false
    default_roll_bias: 0
    default_pitch_bias: 8
    reply_style: "低刺激、關心、鼓勵休息。"
    fallback_reply: "你聽起來真的很累，先讓自己喘一口氣也可以。"
  angry:
    definition: "使用者表達憤怒、被冒犯、不公平、很煩。"
    robot_emotion: concerned
    face_id: FACE_ANGRY
    motion_id: ANGRY_SHORT_SHAKE
    roll_feature: "快速小幅左右搖。"
    pitch_feature: "略微往下，像認真聽。"
    speed: 42
    amplitude: "small"
    hold_ms: 800
    return_to_center: true
    default_roll_bias: 0
    default_pitch_bias: 5
    reply_style: "承接情緒，不火上加油。"
    fallback_reply: "我聽得出來你很不舒服，我們先把最卡的點找出來。"
  surprised:
    definition: "使用者表達驚訝、突然、意外、嚇到。"
    robot_emotion: surprised
    face_id: FACE_SURPRISED
    motion_id: SURPRISED_POP_UP
    roll_feature: "保持中心。"
    pitch_feature: "快速抬頭再回中。"
    speed: 50
    amplitude: "medium"
    hold_ms: 700
    return_to_center: true
    default_roll_bias: 0
    default_pitch_bias: -8
    reply_style: "短促、驚訝、接著詢問。"
    fallback_reply: "真的嗎？這有點出乎意料。"
  curious:
    definition: "使用者提問、探索、想理解原因或細節。"
    robot_emotion: curious
    face_id: FACE_CURIOUS
    motion_id: CURIOUS_TILT
    roll_feature: "向一側歪頭。"
    pitch_feature: "微微抬頭。"
    speed: 25
    amplitude: "medium"
    hold_ms: 1300
    return_to_center: true
    default_roll_bias: 5
    default_pitch_bias: -4
    reply_style: "有興趣、願意一起想。"
    fallback_reply: "這個問題有意思，我們可以一起拆開看。"
  confused:
    definition: "使用者表達不懂、混亂、矛盾、卡住。"
    robot_emotion: confused
    face_id: FACE_CONFUSED
    motion_id: CONFUSED_DOUBLE_TILT
    roll_feature: "左右各歪一次。"
    pitch_feature: "微微低頭，像在重新理解。"
    speed: 24
    amplitude: "medium"
    hold_ms: 1100
    return_to_center: true
    default_roll_bias: 0
    default_pitch_bias: 3
    reply_style: "釐清、簡化、不要責備。"
    fallback_reply: "我懂，這裡有點繞，我們一步一步看。"
  thinking:
    definition: "使用者在權衡、分析、做決定，情緒不強但需要思考感。"
    robot_emotion: thinking
    face_id: FACE_THINKING
    motion_id: THINKING_LOOK_DOWN_UP
    roll_feature: "小幅偏移。"
    pitch_feature: "慢慢低頭再微抬。"
    speed: 18
    amplitude: "small"
    hold_ms: 1400
    return_to_center: true
    default_roll_bias: -3
    default_pitch_bias: 2
    reply_style: "沉穩、提出選項。"
    fallback_reply: "我先想一下，這可以分成幾個方向看。"
  concerned:
    definition: "使用者表達擔心、焦慮、不安、壓力，或內容需要被溫柔承接。"
    robot_emotion: concerned
    face_id: FACE_CONCERNED
    motion_id: CONCERNED_SOFT_NOD
    roll_feature: "很小幅偏頭。"
    pitch_feature: "略低、柔和點頭。"
    speed: 18
    amplitude: "small"
    hold_ms: 1600
    return_to_center: false
    default_roll_bias: 2
    default_pitch_bias: 5
    reply_style: "安定、接住、避免過度樂觀。"
    fallback_reply: "我聽見你的擔心了，我們先處理眼前最重要的一件事。"
  sleepy:
    definition: "使用者想睡、睏、精神很低或提到睡眠。"
    robot_emotion: sleepy
    face_id: FACE_SLEEPY
    motion_id: SLEEPY_BREATH
    roll_feature: "幾乎不動。"
    pitch_feature: "很小幅、很慢的上下起伏。"
    speed: 10
    amplitude: "tiny"
    hold_ms: 2000
    return_to_center: false
    default_roll_bias: 0
    default_pitch_bias: 7
    reply_style: "放慢、溫和、少刺激。"
    fallback_reply: "聽起來你需要休息了，我會把節奏放慢一點。"

